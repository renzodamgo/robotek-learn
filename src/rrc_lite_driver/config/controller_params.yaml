rrc_driver:
  ros__parameters:
    imu_frame: "imu_link"
    init_finish: false
    port: ""          # vacio = /dev/rrc_lite (udev) o /dev/ttyACM0
    acker_channel: 1  # canal PWM del servo de dirección: en el coche del equipo, J4 es el canal 1 (medido 1 nov 2026)
    motor_type: -1    # -1 = no se envia. Con 2 (JGB27) el motor arranco solo y no paraba con velocidad 0 (1 nov 2026): no usar sin entenderlo
