<g fill="#444441">
<text x="40" y="482">Pin 1 · 3,3 V → VCC (rojo)   Pin 6 · GND → GND (gris)   STBY ↔ VCC: puente en la placa (morado, rayas)</text>
<text x="40" y="502">Pin 29 · GPIO5 → BIN1 (azul)   Pin 31 · GPIO6 → BIN2 (rosa, rayas)   Pin 32 · GPIO12 → PWMB (ámbar)</text>
<text x="40" y="522" fill="#888780">Atenuado: canal A sin usar. El orden de los pines del TB6612 cambia según la placa: guíate por las etiquetas.</text>
