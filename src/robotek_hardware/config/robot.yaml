# Real-car calibration (the Robotek car of this course). Values flagged measured: false or
# "was ... guess" must be measured on your own car before you trust them (see README.md).
base_adapter:
  ros__parameters:
    # 0.1174 m measured on 21 oct 2026 (was 0.13). The servo gains below and steer_limit_deg were
    # derived with 0.13: recalibrate them before driving the car (README.md, section Calibracion).
    wheelbase: 0.1174
    # Steering measured 1 nov 2026 on the floor with tools/steer_calibration.py (gyro yaw rate at 0.209 m/s, bicycle
    # model; battery 8.3 V): 1403 us drives straight (1500 us = 4.5 deg right). 20 us per servo degree on both sides,
    # so the servo angle is just (us - centre) / 20; wheel_table_* below turns it into the real wheel angle.
    servo_center_us: 1403.0
    servo_gain_pos: 20.0             # us per servo degree, right (higher us)
    servo_gain_neg: 20.0             # us per servo degree, left (lower us)
    servo_sign: 1.0                  # +angle turns left = lower us
    servo_min_us: 1000.0
    servo_max_us: 2050.0
    steer_limit_deg: 25.0
    servo_duration: 0.05
    # Measured 8 oct 2026 (motor_driver, 1 s straight pulses at 10-30 %, battery 7.3 V, i.e.
    # low): v = 0.0137 * (pct - 6.5) m/s. Only checked up to 30 % (0.32 m/s); re-measure with a
    # charged battery.
    motor_pct_per_mps: 73.0          # % of PWM per m/s (was a 40.0 guess)
    motor_min_pct: 6.5               # % where the car starts to move (was a 12.0 guess)
    motor_max_pct: 50.0              # real Open tests 8 oct 2026: 40 ok, 90 too fast (crash); now 50; was 100
    accel_limit: 1.0                 # m/s^2 (a full-power start lifts the front wheels)
    # Real wheel angle per servo angle (1 nov 2026, steer_calibration.py; servo deg = (us - 1403) / 20), interpolated
    # at the same servo angles on both sides. Measured: left 1300 4.4, 1200 9.6, 1100 15.7, 1050 19.9 deg;
    # right 1500 4.5, 1600 8.8, 1700 13.8, 1800 17.9, 1900 19.2 (19.5), 1950 18.1 deg: the right side stops at
    # ~19.3 deg by this method (2000 us hit something and skidded; left 1000 us gave 24 and 14: not used; the left
    # points at 20 and 25 servo deg are extrapolated). The radius on the floor gave ~21 deg for the right maximum:
    # the gyro reads less at full lock (the front tyres slip), the same on both sides, so both sides are compared
    # with this method. wheel_limit_deg = the right maximum, so +-19 deg is the same angle on both sides and every
    # angle in between is proportional (19 deg: ~1061 us left, ~1877 us right).
    wheel_table_servo_deg: [5.0, 10.0, 15.0, 17.5, 20.0, 25.0]
    wheel_table_left_deg: [4.24, 9.42, 15.55, 19.63, 23.7, 31.9]
    wheel_table_right_deg: [4.63, 8.93, 13.92, 15.99, 17.98, 19.35]
    wheel_limit_deg: 19.0
    servo_measured: true
    decel_limit: 0.6                 # m/s^2 (a hard stop makes the wheels skid)
    # Drive motor (1 nov 2026): the team's car now uses an encoder motor on port M4 of the RRC Lite (+rps = backward),
    # not the DC motor on the TB6612 (its channel B gave no output). 'tb6612' goes back to /motor_vel and the motor_pct_*
    # values above. motor_rps_per_mps = motor revolutions per second per m/s of the car: MEASURE IT (until then 0 keeps
    # the motor at 0). motor_max_rps 0 = no cap.
    motor_backend: rrc
    rrc_motor_port: 2                # 8 nov 2026: the 310 motor on M2 (as the MentorPi), with no motor type sent (rrc_lite_driver
                                     # motor_type -1): the board's own speed loop then follows the rps and stops on 0.
                                     # (1-4 nov: M1/M2 with motor_type 2 = the JGA27's negative PID gains against our encoder:
                                     # full PWM, no stop on 0, sometimes backwards.)
    rrc_motor_sign: -1.0             # 8 nov 2026, M2 without motor type: +rps straight to the board drives forward, and
                                     # rrc_driver sends -rps: so -1 here. Re-check it with the LiDAR if port or type change.
    # Brake (4 nov 2026): with the 310 motor the board does not hold 0 (runs on, speeds up or rolls back). Stopping after
    # moving, the motor gets +-brake_rps alternating at brake_hz for brake_s, then 0: on the floor the car stopped
    # ~12 cm after the order, 3 times out of 3 (type 2, 4 rps). brake_rps 0 = off (a plain 0).
    brake_rps: 0.0                   # 8 nov: off; without motor type a plain 0 stops the car (~8-10 cm from 0.6 m/s)
    brake_hz: 10.0
    brake_s: 1.5
    brake_min_rps: 0.3               # the Open's finish crawls at ~0.7-1.9 rps: brake after that too
    brake_reset: false               # 8 nov: off (a plain 0 stops it). true = reset the board (RTS) to stop, the 1-4 nov work-around
    brake_reset_states: FINISH,DONE,OPERATOR_STOP,DIRECTION_FAULT   # only at the end (+ button stop, watchdog); other
                                     # stops send 0: a stale-IMU brake reset the board mid-round, ~4 s lost (test 26)
    # Motor (user, 8 nov 2026): JGA27-310R, 20:1 gearbox, 7.4 V, 450 rpm no load at the gearbox shaft (7.5 turns/s);
    # gears motor:axle 54:30 until 8 nov 2026 (the big gear on the motor: x1.8 up, 810 rpm at the wheels, 2.6 m/s no
    # load; wheel r 30.5 mm, 0.192 m per turn). Every number below (0.209 m/s per board rps, 2.5 rps ~0.55-0.85 m/s, the
    # Open rounds of 4 nov at ~0.85 m/s) is from that gearing: the board's 25 % PWM cut was ~0.65 m/s there.
    # User, 8 nov: now 30:54 (the small gear on the motor): 250 rpm at the wheels, 0.80 m/s no load, 3.24x slower per
    # board rps -> motor_rps_per_mps ~15.6 and motor_max_rps x3.24 (MEASURE them on the floor before any round). The board's "rps" is not real turns of this motor (its speed loop uses the JGB27 encoder model, motor_type
    # 2): 1 board rps = 0.209 m/s = ~2.0 real shaft turns/s, and it is not linear. The board's speed loop zeroes the
    # PWM below 25 % (|pulse| < 250 of 1000, Hiwonder RRC firmware docs), i.e. ~0.2 m/s no load for this fast motor:
    # it cannot hold 0.15-0.30 m/s. On the floor it either does not start or runs at ~0.35-0.4 m/s (Obstacle v3, 4 nov:
    # gyro 1.0-1.2 rad/s at full lock with 0.15-0.30 m/s asked). LiDAR, 1 nov 2026: 1 rps 0.209 m/s (repeatable); ~1.9 rps 0.65-0.69 m/s
    # peak forward (0.45 mean, battery ~7 V), 0.40-0.44 m/s backward = the motor's limit. Above ~2 rps the motor cannot
    # turn faster: the board only pushes more current (a frontal crash at full push stalled and overheated it).
    motor_rps_per_mps: 4.0           # 8 nov 2026, 54:30 gears (big gear on the motor again): 13.0 measured with 30:54 / 3.24 (MEASURE it)
    motor_max_rps: 3.1               # ~0.77 m/s with 4.0 rps per m/s (54:30 gears; was 10.0 with 30:54)
    motor_min_rps: 0.0               # > 0: any moving command gets at least this (8 nov 2026: the 310 motor does not start
                                     # the car at ~1 rps, 0.20 m/s of the Obstacle v3 with full lock; car.launch.py motor_min_rps:=1.5)
    # Wall guard: forward speed scaled down from wall_slow_m to 0 at wall_stop_m (nearest LiDAR return within +-wall_half_deg
    # of straight ahead; the LiDAR is ~2 cm behind the front of the car), smoothly through decel_limit. 0 = off.
    wall_stop_m: 0.10
    wall_slow_m: 0.30
    wall_half_deg: 15.0
    watchdog: 0.3
scan_adapter:
  ros__parameters:
    angle_offset: 0.0                # new build (1 nov 2026, checked in RViz with a box in front): the LD19 zero points FORWARD;
                                     # the car body fills 120-240 deg. Old build: 3.14159265359 (zero backwards)
    reverse: false                   # checked 1 nov 2026 in RViz: 90 deg is the car's left (angles grow counterclockwise)
    frame_id: lidar_link
    fov_deg: 110.0                   # measured: beyond +-110 deg the rays hit the car itself
    min_valid_range: 0.12            # m: drops those 2-8 cm returns of the chassis
tb6612fng_motor:
  ros__parameters:
    gpiochip: 4
    pwm_a: 12
    ain1: 5
    ain2: 6
    stby: 13
    pwm_hz: 1000
    watchdog_s: 0.30
    brake_mode: ramp                 # soft stop; 'reverse' = old brake (skids)
    stop_ramp_s: 0.6

# IMU of the RRC Lite -> car frame (x forward, y left, z up) before the strategies read it.
# The Raspberry Pi and the RRC Lite stand on their long edge in the new build (21 oct 2026). Measured on
# the team's car on 1 nov 2026, axis by axis (guide: "Medir a mano, eje por eje"): the RRC Lite stands
# on its edge on the left side with its components facing out. At rest board y = +9.70 m/s^2 (up);
# nose lifted ~14 deg: board x -2.44 (x points back); left side lifted: board z +3.59 (z points left);
# a hand turn to the left: board gyro y +0.36 rad/s, the other axes ~0. Gyro y bias at rest +0.043 rad/s
# (the strategy measures it after Start). Re-measure with `ros2 run robotek_hardware imu_axes` if the
# board moves.
imu_adapter:
  ros__parameters:
    forward_axis: '-x'
    left_axis: '+z'
    up_axis: '+y'
    frame_id: imu_link
    measured: true

# Camera node (robotek_hardware camera_publisher). rotate_180: the camera of the team's car is mounted upside down
# (new build, checked 1 nov 2026: the field appears upside down and the LiDAR at the top of the image).
camera_publisher:
  ros__parameters:
    rotate_180: true
    # Lens correction (one-coefficient radial model) and crop to the simulated camera's 60 deg: fitted 1 nov 2026 so the
    # far wall's lower edge is straight (rms 0.8 px), with the team's measured 66.7 deg field (fit gives 66.6).
    undistort: true
    camera_f: 570.0
    camera_k1: -0.34
    output_hfov_deg: 60.0
